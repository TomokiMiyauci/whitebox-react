  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Type Check
        run: deno check

